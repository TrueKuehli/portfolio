  - id: "underwater-tone-mapping"
    title: "Optimizing Temporal Stability in Underwater Video Tone Mapping"
    authors:
      - name: "Matthias Franz"
        affiliation: "Technische Universität, Braunschweig"
      - name: "Bill Matthias Thang"
        affiliation: "Technische Universität, Braunschweig"
      - name: "Pascal Sackhoff"
        affiliation: "Technische Universität, Braunschweig"
      - name: "Timon Scholz"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
      - name: "Jannis Malte Möller"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/moller"
      - name: "Steve Grogorick"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/grogorick"
      - name: "Martin Eisemann"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/eisemann"
    abstract: "In this paper, we present an approach for temporal stabilization of depth-based underwater 
        image tone mapping methods for application to monocular RGB video. Typically, the goal is to improve 
        the colors of focused objects, while leaving more distant regions nearly unchanged, to preserve the 
        underwater look-and-feel of the overall image. To do this, many methods rely on estimated depth to 
        control the recolorization process, i.e., to enhance colors (reduce blue tint) only for objects close 
        to the camera. However, while single-view depth estimation is usually consistent within a frame, it 
        often suffers from inconsistencies across sequential frames, resulting in color fluctuations during 
        tone mapping. We propose a simple yet effective inter-frame stabilization of the computed depth maps 
        to achieve stable tone mapping results. The evaluation of eight test sequences shows the effectiveness 
        in a wide range of underwater scenarios."
    short_abstract: "We present a method for temporal stabilization of depth-based underwater image tone 
        mapping methods for application to monocular RGB video, improving color consistency across frames."
    acknowledgements: "Partially funded by the Deutsche Forschungsgemeinschaft (DFG,
        German Research Foundation) – 491805996 and by the Lower Saxony Ministry of 
        Science and Culture under grant number ZN3994 within the Lower Saxony “Vorab“ 
        of the Volkswagen Foundation and supported by the Center for Digital Innovations (ZDIN)."
    journal: "Proc. Vision, Modeling and Visualization (VMV)"
    publication_date: "2023"
    is_oral_presentation: false
    is_poster: true
    keywords:
