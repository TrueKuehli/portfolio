  - id: "dnpc"
    title: "D-NPC: Dynamic Neural Point Clouds for Non-Rigid View Synthesis from Monocular Video"
    authors:
      - name: "Moritz Kappel"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://moritzkappel.github.io/"
      - name: "Florian Hahlbohm"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://fhahlbohm.github.io/"
      - name: "Timon Scholz"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
      - name: "Susana Castillo"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/castillo"
      - name: "Christian Theobalt"
        affiliation: "Max Planck Institute for Informatics, Saarland Informatics Campus"
        link: "https://people.mpi-inf.mpg.de/~theobalt/"
      - name: "Martin Eisemann"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/eisemann"
      - name: "Vladislav Golyanik"
        affiliation: "Max Planck Institute for Informatics, Saarland Informatics Campus"
        link: "https://people.mpi-inf.mpg.de/~golyanik/"
      - name: "Marcus Magnor"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/magnor"
    abstract: "Dynamic reconstruction and spatiotemporal novel-view synthesis of non-rigidly deforming scenes 
        recently gained increased attention. While existing work achieves impressive quality and performance on 
        multi-view or teleporting camera setups, most methods fail to efficiently and faithfully recover motion 
        and appearance from casual monocular captures. This paper contributes to the field by introducing a 
        new method for dynamic novel view synthesis from monocular video, such as casual smartphone captures. 
        Our approach represents the scene as a dynamic neural point cloud, an implicit time-conditioned point 
        distribution that encodes local geometry and appearance in separate hash-encoded neural feature grids 
        for static and dynamic regions. By sampling a discrete point cloud from our model, we can efficiently 
        render high-quality novel views using a fast differentiable rasterizer and neural rendering network. 
        Similar to recent work, we leverage advances in neural scene analysis by incorporating data-driven priors 
        like monocular depth estimation and object segmentation to resolve motion and depth ambiguities 
        originating from the monocular captures. In addition to guiding the optimization process, we show that 
        these priors can be exploited to explicitly initialize our scene representation to drastically improve 
        optimization speed and final image quality. As evidenced by our experimental evaluation, our dynamic point 
        cloud model not only enables fast optimization and real-time frame rates for interactive applications, but 
        also achieves competitive image quality on monocular benchmark sequences."
    short_abstract: "D-NPC enables fast, non-rigid view synthesis from monocular video by expanding extending
        Implicit Neural Point Clouds (INPC) to the temporal domain."
    journal: "Eurographics (Computer Graphics Forum)"
    publication_date: "2025"
    is_oral_presentation: true
    keywords:
      - "Image-based rendering"
      - "Point-based models"
      - "Reconstruction"
      - "Rasterization"
    categories:
      - "Novel View Synthesis"
    links:
      Video: "https://www.youtube.com/watch?v=NSpptS38uL0"
      Paper: "https://arxiv.org/abs/2406.10078"
      Code: "https://github.com/MoritzKappel/D-NPC"
