  - id: "velocity-eccentricity"
    title: "Measuring Velocity Perception Regarding Stimulus Eccentricity"
    authors:
      - name: "Timon Scholz"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
      - name: "Colin Groth"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://colingroth.github.io/"
      - name: "Susana Castillo"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/castillo"
      - name: "Martin Eisemann"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/eisemann"
      - name: "Marcus Magnor"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/magnor"
    abstract: "A major factor resulting in cybersickness is the feeling of self-motion experienced when 
      viewing a moving scene in Virtual Reality (VR). Current research indicates that this effect is 
      largely created by motion in the periphery. To discover why this is the case, we investigate the 
      influence of temporal frequency and eccentricity of a stimulus on the magnitude of perceived 
      velocity in the periphery. Based on the perception of two-dimensional stimuli on a wide field-of-view 
      display, we build a model to predict the scaling factor by which the perceived velocity of visual 
      patterns deviates from the physical velocity. Further, our exploratory findings indicate no impact of 
      gaze type on the results, suggesting our model works for both fixation and smooth pursuit scenarios. 
      In an additional pilot study in Virtual Reality (VR), we test the accuracy of the model to predict 
      unnoticeable object motion adaptation in 3D virtual worlds and find positive indications for a similar 
      effect."
    short_abstract: "We investigate the influence of temporal frequency and eccentricity of a stimulus on the 
        magnitude of perceived velocity in the periphery, building a model to predict the scaling factor for 
        perceived velocity deviations relative to eccentricity."
    acknowledgements: "The authors gratefully acknowledge partial funding by the DFG 
        (MA2555/17-1, \"Real-Action VR: Immersive Experience of ActionCam Video Recordings\", 
        Project number 523421583)."
    journal: "ACM Symposium on Applied Perception (SAP)"
    publication_date: "2024"
    is_oral_presentation: true
    categories:
