papers:
  - id: "hand-redirection"
    title: "Instant Hand Redirection in Virtual Reality Through Electrical Muscle Stimulation-Triggered Eye Blinks"
    authors:
      - name: "Colin Groth"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://colingroth.github.io/"
      - name: "Timon Scholz"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
      - name: "Susana Castillo"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/castillo"
      - name: "Jan-Philipp Tauscher"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/tauscher"
      - name: "Marcus Magnor"
        affiliation: "Computer Graphics Lab, TU Braunschweig"
        link: "https://graphics.tu-bs.de/people/magnor"
    abstract: "In this paper, we investigate the use of electrical muscle stimulation (EMS) to trigger eye blinks 
        for instant hand redirection in virtual reality (VR). With the rapid development of VR technology and 
        increasing user expectations for realistic experiences, maintaining a seamless match between real and 
        virtual objects becomes crucial for immersive interactions. However, hand movements are fast and sometimes 
        unpredictable, increasing the need for instantaneous redirection. We introduce EMS to the field of hand 
        redirection in VR through precise stimulation of the eyelid muscles. By exploiting the phenomenon of change 
        blindness through natural eye blinks, our novel stimulation model achieves instantaneous, imperceptible 
        hand redirection without the need for eye tracking. We first empirically validate the efficiency of our EMS 
        model in eliciting full eye closure. In a second experiment, we demonstrate the feasibility of using such a 
        technique for seamless instantaneous displacement in VR and its particular impact for hand redirection. 
        Among other factors, our analysis also delves into the under-explored domain of gender influence on hand 
        redirection techniques, revealing significant gender-based performance disparities."
    short_abstract: "We propose a method for instant hand redirection in VR using electrical muscle stimulation (EMS) 
        to trigger eye blinks, enabling seamless interaction between real and virtual objects."
    journal: "ACM Symposium on Virtual Reality Software and Technology (VRST)"
    publication_date: "2023"
    categories:
      - "Perception"
      - "Virtual Reality"
    keywords:
      - "Hand redirection"
      - "EMS"
      - "Virtual reality"
      - "Redirection"
      - "VR"
      - "Eye blinks"
    links:
      Video: "https://www.youtube.com/watch?v=TGZYa9tAVPQ"
